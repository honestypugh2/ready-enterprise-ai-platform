# Dependency updates.
#
# Grouped so a week's patches arrive as one reviewable pull request rather than
# fifteen. Security updates are deliberately left ungrouped and unscheduled, so
# they arrive immediately and on their own.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned below 1.44 by azure-monitor-opentelemetry. Raising it breaks
      # resolution; see the comment in pyproject.toml.
      - dependency-name: opentelemetry-*
        update-types: [version-update:semver-minor]
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps(web)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps(docker)
