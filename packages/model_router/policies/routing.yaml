# Versioned model routing policy.
#
# A route is a policy decision about which component answers a request, and it
# is recorded with the same rigour as any other policy decision. "Why did this
# request reach a frontier model?" is a question an auditor is entitled to ask
# six months afterwards, and this file plus the emitted RouteDecision is the
# answer.
#
# Deterministic code and rules engines are first-class routes. A router that can
# only choose between language models has already conceded the argument.

version: "1.3.0"
description: >-
  Routing policy for the manufacturing quality workload. Selects the cheapest,
  fastest component that satisfies the request's capability, latency,
  classification, residency and cost constraints.

# A route with no evaluation reference is only selectable when a rule sets
# allow_unproven: true. Benchmarks are the customer's to produce; this file
# names where the evidence should live, and does not invent scores.
require_evaluation_evidence: true

routes:
  - route_id: deterministic-severity-calculator
    kind: deterministic_code
    supports: [calculate, score]
    capabilities: [severity_arithmetic, threshold_comparison]
    typical_latency_ms: 1
    max_classification: restricted
    cost_category: none
    execution_location: local_process
    deterministic: true
    evaluation_ref: eval/routing/deterministic-calculator.json

  - route_id: manufacturing-policy-rules
    kind: rules_engine
    supports: [classify, score]
    capabilities: [disposition_policy, approval_policy]
    typical_latency_ms: 3
    max_classification: restricted
    cost_category: none
    execution_location: local_process
    deterministic: true
    evaluation_ref: eval/routing/policy-rules.json

  - route_id: local-defect-detector
    kind: local_onnx
    supports: [detect, classify]
    capabilities: [vision_defect_detection]
    typical_latency_ms: 25
    max_classification: restricted
    cost_category: negligible
    execution_location: edge
    evaluation_ref: eval/routing/local-detector.json

  - route_id: aml-defect-endpoint
    kind: aml_endpoint
    supports: [detect, classify, score, forecast]
    capabilities: [vision_defect_detection, batch_scoring]
    typical_latency_ms: 90
    max_classification: confidential
    cost_category: low
    execution_location: azure_regional
    residency: primary
    evaluation_ref: eval/routing/aml-endpoint.json

  - route_id: mock-reasoner
    kind: mock
    supports: [explain, summarise, extract]
    capabilities: [natural_language_explanation, evidence_grounding]
    typical_latency_ms: 15
    max_classification: restricted
    cost_category: none
    execution_location: mock
    deterministic: true
    evaluation_ref: eval/routing/mock-reasoner.json

  - route_id: small-language-model
    kind: small_language_model
    supports: [explain, summarise, extract, classify]
    capabilities: [natural_language_explanation, evidence_grounding]
    typical_latency_ms: 600
    max_classification: confidential
    cost_category: low
    execution_location: azure_regional
    residency: primary
    evaluation_ref: eval/routing/small-language-model.json

  - route_id: frontier-model
    kind: frontier_model
    supports: [explain, summarise, plan, extract]
    capabilities:
      [natural_language_explanation, evidence_grounding, complex_synthesis, unfamiliar_task]
    typical_latency_ms: 2200
    max_classification: confidential
    cost_category: high
    execution_location: azure_regional
    residency: primary
    evaluation_ref: eval/routing/frontier-model.json

  - route_id: foundry-model-router
    kind: foundry_model_router
    supports: [explain, summarise, plan]
    capabilities: [natural_language_explanation, evidence_grounding, complex_synthesis]
    typical_latency_ms: 1500
    max_classification: confidential
    cost_category: medium
    execution_location: azure_regional
    residency: primary
    # Deliberately unproven in this repository: adopting a managed router is a
    # benchmarking decision the customer makes against their own traffic.
    evaluation_ref: null

# Ordered. First rule whose conditions hold selects the route.
rules:
  - id: RR010-deterministic-first
    description: >-
      Anything that must be identical twice goes to code. Generation is the
      wrong instrument for arithmetic, eligibility, thresholds and safety limits.
    when:
      task_type_in: [calculate]
    prefer: [deterministic-severity-calculator]
    reason_code: DETERMINISTIC_TASK

  - id: RR020-detection-to-specialist
    description: Detection is a specialized-model task at every latency budget.
    when:
      task_type_in: [detect]
    prefer: [local-defect-detector, aml-defect-endpoint]
    reason_code: SPECIALIZED_VISION_TASK

  - id: RR030-restricted-stays-local
    description: >-
      Restricted data never leaves the local boundary. The classifier is a
      security control as much as an economic one, and this rule belongs under
      the same change management as a firewall rule.
    when:
      classification_at_least: restricted
    prefer: [deterministic-severity-calculator, manufacturing-policy-rules, mock-reasoner]
    reason_code: RESTRICTED_DATA_LOCAL_ONLY

  - id: RR040-tight-latency-budget
    description: A sub-200ms budget disqualifies every hosted language model.
    when:
      max_latency_ms_below: 200
    prefer: [deterministic-severity-calculator, manufacturing-policy-rules, local-defect-detector]
    reason_code: LATENCY_BUDGET_EXCLUDES_LANGUAGE_MODELS

  - id: RR050-complex-synthesis-earns-frontier
    description: >-
      A frontier model is selected when the task genuinely requires breadth,
      not as a default. This is the only rule that can reach one for reasoning,
      and it is placed above the general explanation rule because a more
      specific rule must win.
    when:
      task_type_in: [plan, explain, summarise]
      requires_capabilities: [complex_synthesis]
    prefer: [frontier-model, foundry-model-router]
    reason_code: COMPLEX_SYNTHESIS_REQUIRED
    allow_unproven: true

  - id: RR060-high-risk-needs-strongest-evidence
    description: >-
      Critical business risk raises the quality floor even when the cheaper
      route would satisfy the functional requirement.
    when:
      business_risk_in: [critical]
      task_type_in: [explain, summarise]
    prefer: [frontier-model, small-language-model]
    reason_code: CRITICAL_RISK_QUALITY_FLOOR

  - id: RR070-explanation-default-small
    description: >-
      Most explanation traffic does not need the largest model. Route to the
      smallest model that passes the benchmark; the saving compounds daily.
    when:
      task_type_in: [explain, summarise, extract]
    prefer: [mock-reasoner, small-language-model, frontier-model]
    reason_code: SMALLEST_SUFFICIENT_MODEL

fallback:
  # Every route must have somewhere to go when its first choice is unavailable.
  # A fallback rate is an early warning that capacity or policy has drifted away
  # from the traffic it was designed for, so fallbacks are recorded, not silent.
  order: [mock-reasoner, manufacturing-policy-rules, deterministic-severity-calculator]
  reason_code: PRIMARY_ROUTE_UNAVAILABLE
